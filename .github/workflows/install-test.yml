# Installs everything from zero on a fresh Ubuntu machine with install.sh (test certificate mode,
# since there is no public domain here), then runs both end-to-end test suites against it.
name: install test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install from this checkout
        run: |
          ip=$(hostname -I | awk '{print $1}')
          sudo env DOMAIN=example.test MAIL_HOST=mx.example.test ADMIN_EMAIL=admin@example.test \
            ACME_EMAIL=ops@example.org SERVER_IP="$ip" CERT_METHOD=selfsigned APP_BUILD=1 \
            MAILSERVER_SRC="$PWD" bash install.sh --yes
      - name: Mail server test
        run: sudo mailctl test admin@example.test
      - name: Console, API, MCP and OAuth tests
        run: sudo mailctl test-app
      - name: Logs on failure
        if: failure()
        run: |
          sudo docker logs mailapp --tail 200 || true
          sudo docker logs mailserver --tail 200 || true

  one-liner:
    # exactly what a new user runs: the installer and the code from GitHub, the published app image
    if: github.event_name != 'pull_request'
    needs: install
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Wait for the app image built from this commit
        run: |
          for i in $(seq 1 60); do
            docker manifest inspect ghcr.io/${{ github.repository_owner }}/myotgo-mail-app:${{ github.sha }} >/dev/null 2>&1 && exit 0
            sleep 20
          done
          echo "the image for ${{ github.sha }} was not published within 20 minutes" >&2; exit 1
      - name: curl | bash, as in the README
        run: |
          ip=$(hostname -I | awk '{print $1}')
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.sh | \
            sudo env DOMAIN=example.test ADMIN_EMAIL=admin@example.test ACME_EMAIL=ops@example.org \
              SERVER_IP="$ip" CERT_METHOD=selfsigned MAILSERVER_REPO=https://github.com/${{ github.repository }}.git \
              APP_IMAGE=ghcr.io/${{ github.repository_owner }}/myotgo-mail-app:${{ github.sha }} \
              bash -s -- --yes
      - name: The published app image was used (nothing built)
        run: sudo docker inspect mailapp --format '{{.Config.Image}}' | grep -q '^ghcr.io/'
      - name: Mail server test
        run: sudo mailctl test admin@example.test
      - name: Console, API, MCP and OAuth tests
        run: sudo mailctl test-app
      - name: Logs on failure
        if: failure()
        run: |
          sudo docker logs mailapp --tail 200 || true
          sudo docker logs mailserver --tail 200 || true
