# The mail server and its console/API/MCP app. `./mail deploy` writes the .env file next to
# this one on the server (MAIL_HOST, DOMAIN), so nothing here is specific to one domain.
networks:
  mailnet:
    ipam:
      config:
        - subnet: 172.31.250.0/24

services:
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:16.0.1
    container_name: mailserver
    hostname: ${MAIL_HOST:?set MAIL_HOST in .env}
    env_file: mailserver.env
    environment:
      OVERRIDE_HOSTNAME: ${MAIL_HOST}
      POSTMASTER_ADDRESS: postmaster@${DOMAIN:?set DOMAIN in .env}
      SSL_CERT_PATH: /etc/mailcerts/${MAIL_HOST}.crt
      SSL_KEY_PATH: /etc/mailcerts/${MAIL_HOST}.key
    ports:
      - "25:25"     # incoming mail from other servers
      - "465:465"   # sending from mail apps (TLS)
      - "587:587"   # sending from mail apps (STARTTLS)
      - "993:993"   # reading mail (IMAP over TLS)
    volumes:
      - ./data/mail-data/:/var/mail/
      - ./data/mail-state/:/var/mail-state/
      - ./data/mail-logs/:/var/log/mail/
      - ./data/config/:/tmp/docker-mailserver/
      - ./data/certs/:/etc/mailcerts/:ro
      - /etc/localtime:/etc/localtime:ro
    restart: always
    stop_grace_period: 1m
    cap_add:
      - NET_ADMIN   # fail2ban
    healthcheck:
      test: "ss --listening --tcp | grep -P 'LISTEN.+:smtp' || exit 1"
      timeout: 3s
      retries: 0
    mem_limit: 700m
    networks:
      mailnet:
        ipv4_address: 172.31.250.2
        # the app reaches the mail server under its public name, so TLS checks pass
        aliases: ["${MAIL_HOST}"]

  app:
    build: ./app
    image: mailapp:local
    container_name: mailapp
    env_file: ./secrets/app.env        # APP_SECRET_KEY, created by ./mail deploy
    environment:
      MAIL_HOST: ${MAIL_HOST}
      DOMAIN: ${DOMAIN}
    ports:
      - "443:8443"   # web console, REST API and MCP (HTTPS)
    volumes:
      - ./data/app/:/data/                 # the app's SQLite database
      - ./data/config/:/mailconfig/        # mailbox and alias files it manages
      - ./data/mail-data/:/maildata/       # only to remove the mail of deleted mailboxes
      - ./data/certs/:/certs/:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]               # remove mail folders owned by the mail server's user
    security_opt: ["no-new-privileges:true"]
    mem_limit: 300m
    restart: always
    depends_on: [mailserver]
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,urllib.request;urllib.request.urlopen('https://127.0.0.1:8443/healthz',context=ssl._create_unverified_context(),timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
    networks:
      mailnet:
        ipv4_address: 172.31.250.10
