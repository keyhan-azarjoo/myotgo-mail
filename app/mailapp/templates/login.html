{% extends "base.html" %}
{% block title %}Sign in · {{ app_name }}{% endblock %}
{% block body_class %}center{% endblock %}
{% block main_class %}card narrow{% endblock %}
{% block content %}
<div class="brandmark"><span class="logo">✉</span> {{ app_name }}</div>
<h1>Sign in</h1>
<form method="post" action="/login" class="stack">
  <input type="hidden" name="next" value="{{ next }}">
  <input type="hidden" name="pre" value="{{ pre }}">
  <label>Email<input type="email" name="email" value="{{ email or '' }}" autocomplete="username" required autofocus></label>
  <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
  <button class="primary">Sign in</button>
</form>
<p class="muted small">Accounts are created by an administrator.</p>
{% endblock %}
